<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Painel de Voos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* ------------------------------------------
       Identidade visual: azul escuro + cinza
       ------------------------------------------ */
    :root {
      --cor-principal: #1a5276;
      --cor-secundaria: #f5f6fa;
      --cor-erro: #e74c3c;
      --cor-carregando: #f39c12;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--cor-secundaria);
      color: #333;
      line-height: 1.4;
    }

    header {
      background: var(--cor-principal);
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: 1rem auto;
      padding: 0 1rem;
    }

    .filters {
      background: #fff;
      padding: 1rem;
      border-radius: 4px;
      box-shadow: 0 2px 4px rgba(0,0,0,.1);
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .filters > * {
      flex: 1 1 200px;
    }

    label {
      display: block;
      margin-bottom: .3rem;
      font-weight: 600;
    }

    select, input[type="date"], button {
      width: 100%;
      padding: .5rem;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    button {
      background: var(--cor-principal);
      color: #fff;
      cursor: pointer;
      margin-top: .5rem;
    }

    button:hover {
      opacity: .9;
    }

    .state-loading,
    .state-error,
    .state-nodata {
      text-align: center;
      padding: 2rem;
      color: var(--cor-erro);
    }

    .state-loading {
      color: var(--cor-carregando);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
      background: #fff;
      box-shadow: 0 2px 4px rgba(0,0,0,.1);
    }

    th, td {
      padding: .8rem;
      border: 1px solid #eee;
      text-align: left;
    }

    th {
      background: var(--cor-principal);
      color: #fff;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }

    /* Responsivo --------------------------------- */
    @media (max-width: 768px) {
      .filters {
        flex-direction: column;
      }
      .filters > * {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>
<header>
  <h1>Painel de Voos</h1>
</header>

<div class="container">
  <!-- Seção de filtros -->
  <section class="filters">
    <div>
      <label for="state-select">Estado</label>
      <select id="state-select">
        <option value="">-- Selecione Estado --</option>
      </select>
    </div>

    <div>
      <label for="city-select">Município</label>
      <select id="city-select" disabled>
        <option value="">-- Selecione Município --</option>
      </select>
    </div>

    <div>
      <label for="airport-select">Aeroporto</label>
      <select id="airport-select" disabled>
        <option value="">-- Selecione Aeroporto --</option>
      </select>
    </div>

    <div>
      <label for="date-input">Data</label>
      <input type="date" id="date-input" disabled>
    </div>

    <div>
      <label for="company-select">Companhia</label>
      <select id="company-select" disabled>
        <option value="">-- Selecione Companhia --</option>
      </select>
    </div>

    <div>
      <label for="op-select">Tipo de Operação</label>
      <select id="op-select" disabled>
        <option value="">-- Selecione Tipo --</option>
        <option value="partida">Partida</option>
        <option value="chegada">Chegada</option>
      </select>
    </div>

    <div style="align-self: flex-end;">
      <button id="search-btn" disabled>Buscar</button>
    </div>
  </section>

  <!-- Área de resultados -->
  <section id="results">
    <!-- Mensagens de estado (carregando, erro, sem dados) serão inseridas aqui -->
  </section>
</div>

<script>
/* ------------------------------------------
   1. Constantes Supabase
   ------------------------------------------ */
const SUPABASE_URL = 'https://ivhjhtwhlkftekmbgkow.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_EoJNU0B6kv-ozYlqLdg3dQ_nHgSwYCj';

/* ------------------------------------------
   2. Função de escape HTML
   ------------------------------------------ */
function escapeHtml(str) {
  return String(str).replace(/[&<>"'`=\/]/g, function (s) {
    return ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
      '`': '&#x60;',
      '=': '&#x3D;',
      '/': '&#x2F;'
    })[s];
  });
}

/* ------------------------------------------
   3. Carregar dados de aeroportos
   ------------------------------------------ */
let airportsData = []; // [{icao, name, city, state, state_code}]
let uniqueCompanies = new Set();

function replaceOptions(select, placeholder) {
  select.replaceChildren();
  const option = document.createElement('option');
  option.value = '';
  option.textContent = placeholder;
  select.appendChild(option);
}

function hojeEmSaoPaulo() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Sao_Paulo',
    year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date());
  const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
  return `${values.year}-${values.month}-${values.day}`;
}

async function loadAirports() {
  try {
    const res = await fetch('data/airports.json');
    if (!res.ok) throw new Error('Falha ao carregar aeroportos');
    const payload = await res.json();
    if (!Array.isArray(payload)) throw new Error('Formato inválido de airports.json');
    airportsData = payload;

    const stateSelect = document.getElementById('state-select');
    const states = [...new Set(airportsData.map(a => a.state).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'pt-BR'));
    for (const state of states) {
      const opt = document.createElement('option');
      opt.value = state;
      opt.textContent = state;
      stateSelect.appendChild(opt);
    }

    document.getElementById('date-input').value = hojeEmSaoPaulo();
  } catch (e) {
    console.error(e);
    showError('Erro ao carregar lista de aeroportos.');
  }
}

/* ------------------------------------------
   4. Manipulação de filtros
   ------------------------------------------ */
document.getElementById('state-select').addEventListener('change', e => {
  const citySelect = document.getElementById('city-select');
  const airportSelect = document.getElementById('airport-select');
  const dateInput = document.getElementById('date-input');
  const companySelect = document.getElementById('company-select');
  const opSelect = document.getElementById('op-select');
  const searchBtn = document.getElementById('search-btn');

  replaceOptions(citySelect, '-- Selecione Município --');
  replaceOptions(airportSelect, '-- Selecione Aeroporto --');
  dateInput.disabled = true;
  companySelect.disabled = true;
  opSelect.disabled = true;
  searchBtn.disabled = true;

  const state = e.target.value;
  if (!state) return;

  const cities = [...new Set(
    airportsData.filter(a => a.state === state).map(a => a.city).filter(Boolean)
  )].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  for (const city of cities) {
    const opt = document.createElement('option');
    opt.value = city;
    opt.textContent = city;
    citySelect.appendChild(opt);
  }
  citySelect.disabled = false;
});

document.getElementById('city-select').addEventListener('change', e => {
  const citySelect = document.getElementById('city-select');
  const airportSelect = document.getElementById('airport-select');
  const dateInput = document.getElementById('date-input');
  const companySelect = document.getElementById('company-select');
  const opSelect = document.getElementById('op-select');
  const searchBtn = document.getElementById('search-btn');

  replaceOptions(airportSelect, '-- Selecione Aeroporto --');
  dateInput.disabled = true;
  companySelect.disabled = true;
  opSelect.disabled = true;
  searchBtn.disabled = true;

  const state = document.getElementById('state-select').value;
  const city = e.target.value;
  if (!city) return;

  const airports = airportsData
    .filter(a => a.state === state && a.city === city)
    .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  for (const a of airports) {
    const opt = document.createElement('option');
    opt.value = a.icao;
    opt.textContent = `${a.name} (${a.icao})`;
    airportSelect.appendChild(opt);
  }
  airportSelect.disabled = false;
});

document.getElementById('airport-select').addEventListener('change', e => {
  const airportSelect = document.getElementById('airport-select');
  const dateInput = document.getElementById('date-input');
  const companySelect = document.getElementById('company-select');
  const opSelect = document.getElementById('op-select');
  const searchBtn = document.getElementById('search-btn');

  if (!e.target.value) {
    dateInput.disabled = true;
    companySelect.disabled = true;
    opSelect.disabled = true;
    searchBtn.disabled = true;
    return;
  }

  dateInput.disabled = false;
  companySelect.disabled = false;
  opSelect.disabled = false;
  searchBtn.disabled = false;
});

/* ------------------------------------------
   5. Buscar voos
   ------------------------------------------ */
async function fetchFlights() {
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '<div class="state-loading">Carregando...</div>';

  const airportCode = document.getElementById('airport-select').value;
  const date = document.getElementById('date-input').value;
  const company = document.getElementById('company-select').value;
  const operation = document.getElementById('op-select').value;

  if (!airportCode || !date) {
    resultsDiv.innerHTML = '<div class="state-error">Selecione aeroporto e data.</div>';
    return;
  }

  const params = new URLSearchParams({
    select: [
      'data_referencia', 'codigo_icao_empresa', 'numero_voo', 'etapa',
      'aeroporto_icao_origem', 'aeroporto_icao_destino',
      'horario_previsto_partida', 'horario_previsto_chegada',
      'equipamento', 'quantidade_assentos', 'tipo_operacao', 'tipo_servico'
    ].join(','),
    data_referencia: `eq.${date}`,
    or: `(aeroporto_icao_origem.eq.${airportCode},aeroporto_icao_destino.eq.${airportCode})`,
    order: 'horario_previsto_partida.asc'
  });

  const url = `${SUPABASE_URL}/rest/v1/voos?${params.toString()}`;
  try {
    const res = await fetch(url, {
      headers: {
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        apikey: SUPABASE_ANON_KEY
      }
    });
    if (!res.ok) throw new Error(`Erro ${res.status}`);
    const data = await res.json();

    if (!Array.isArray(data) || data.length === 0) {
      resultsDiv.innerHTML = '<div class="state-nodata">Nenhum voo encontrado.</div>';
      return;
    }

    // Atualizar lista de companhias para filtro
    uniqueCompanies.clear();
    data.forEach(f => {
      if (f.codigo_icao_empresa) uniqueCompanies.add(f.codigo_icao_empresa);
    });
    const companySelect = document.getElementById('company-select');
    const selectedCompany = companySelect.value;
    replaceOptions(companySelect, '-- Todas as Companhias --');
    Array.from(uniqueCompanies).sort().forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      companySelect.appendChild(opt);
    });
    companySelect.value = selectedCompany;

    const companyFiltered = company
      ? data.filter(f => f.codigo_icao_empresa === company)
      : data;

    // Chegada/partida depende do aeroporto selecionado, não de tipo_operacao.
    const arrivals = companyFiltered.filter(
      f => f.aeroporto_icao_destino === airportCode
    );
    const departures = companyFiltered.filter(
      f => f.aeroporto_icao_origem === airportCode
    );

    resultsDiv.innerHTML = ''; // limpar estado anterior

    if (arrivals.length && operation !== 'partida') {
      const table = createFlightTable('Chegadas', arrivals, 'chegada');
      resultsDiv.appendChild(table);
    }
    if (departures.length && operation !== 'chegada') {
      const table = createFlightTable('Partidas', departures, 'partida');
      resultsDiv.appendChild(table);
    }

    if (!resultsDiv.children.length) {
      resultsDiv.innerHTML = '<div class="state-nodata">Nenhum voo encontrado para os filtros.</div>';
    }

  } catch (e) {
    console.error(e);
    resultsDiv.innerHTML = `<div class="state-error">Falha ao buscar voos. ${escapeHtml(e.message)}</div>`;
  }
}

/* ------------------------------------------
   6. Gerar tabela de voos
   ------------------------------------------ */
function createFlightTable(title, flights, direction) {
  const container = document.createElement('div');

  const header = document.createElement('h2');
  header.textContent = title;
  container.appendChild(header);

  const table = document.createElement('table');

  // Cabeçalho
  const thead = document.createElement('thead');
  thead.innerHTML = `
    <tr>
      <th>Horário</th>
      <th>Número do Voo</th>
      <th>Empresa</th>
      <th>Origem/Destino</th>
      <th>Equipamento</th>
      <th>Assentos</th>
      <th>Tipo</th>
    </tr>
  `;
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  flights.forEach(f => {
    const tr = document.createElement('tr');

    const horario = direction === 'chegada'
      ? f.horario_previsto_chegada
      : f.horario_previsto_partida;
    const instante = horario ? new Date(horario) : null;
    const formatted = instante && !Number.isNaN(instante.getTime())
      ? instante.toLocaleString('pt-BR', {
          timeZone: 'America/Sao_Paulo',
          day: '2-digit', month: '2-digit',
          hour: '2-digit', minute: '2-digit'
        })
      : '—';

    const rota = direction === 'chegada'
      ? f.aeroporto_icao_origem
      : f.aeroporto_icao_destino;

    const cells = [
      formatted,
      `${f.codigo_icao_empresa || ''}${f.numero_voo || ''}` || '—',
      f.codigo_icao_empresa || '—',
      rota || '—',
      f.equipamento || '—',
      f.quantidade_assentos ?? '—',
      f.tipo_operacao || f.tipo_servico || '—'
    ];

    cells.forEach(txt => {
      const td = document.createElement('td');
      td.textContent = String(txt); // textContent evita injeção de HTML
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  container.appendChild(table);
  return container;
}

/* ------------------------------------------
   7. Evento do botão de busca
   ------------------------------------------ */
document.getElementById('search-btn').addEventListener('click', fetchFlights);

/* ------------------------------------------
   8. Iniciar
   ------------------------------------------ */
loadAirports();
</script>
</body>
</html>
